[package]
name = "scenesmith-studio"
version = "0.1.0"
description = "Native Mac shell for the SceneSmith Studio control room"
authors = ["SceneSmith"]
edition = "2021"

[lib]
name = "scenesmith_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

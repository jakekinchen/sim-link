#:schema https://developers.openai.com/codex/config-schema.json

# Pin the exact quality-first model requested for this unattended run.
model = "gpt-5.6-sol"
model_reasoning_effort = "max"

# The owner requires trusted tasks in this repository to run with full access
# and without approval prompts. Hardware work must still independently prove
# this exact effective runtime through the robot-lab execution-profile verifier;
# Codex permissions never grant a live gate or robot authority.
sandbox_mode = "danger-full-access"
approval_policy = "never"

[features]
goals = true
multi_agent = false
prevent_idle_sleep = true

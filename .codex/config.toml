#:schema https://developers.openai.com/codex/config-schema.json

# Pin the exact quality-first model requested for this unattended run.
model = "gpt-5.6-sol"
model_reasoning_effort = "max"

# Keep the committed project default owner-interactive and workspace-bounded.
# Autonomous offline work must opt into the separately reviewed
# `.codex/profiles/offline-autonomous.toml` semantics. Hardware work must use
# `.codex/profiles/hardware-supervised.toml` and independently prove the active
# runtime through the robot-lab hardware-execution-profile verifier.
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[features]
goals = true
multi_agent = false
prevent_idle_sleep = true
